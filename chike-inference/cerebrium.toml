[cerebrium.deployment]
name = "chike-inference"
python_version = "3.11"
docker_base_image_url = "nvidia/cuda:12.1.1-runtime-ubuntu22.04"

[cerebrium.hardware]
compute = "ADA_L4"

[cerebrium.scaling]
min_replicas = 1
max_replicas = 2
cooldown = 300
response_grace_period = 180

[cerebrium.dependencies.pip]
transformers = ">=4.43.0"
torch = ">=2.0.0"
huggingface_hub = ">=0.23.0"
accelerate = ">=0.30.0"
