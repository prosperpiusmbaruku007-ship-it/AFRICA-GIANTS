model:
  base_model_name: "prospAprospA007/Afrique-llama-8B"
  local_prod_dir: "models/current"
  local_candidates_dir: "models/candidates"
  local_adapters_dir: "models/adapters"
  local_archived_dir: "models/archived"
  
training:
  type: "sft" # sft or cpt
  max_seq_length: 2048
  packing: false
  
lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  bias: "none"
  task_type: "CAUSAL_LM"

hyperparameters:
  learning_rate: 0.0002
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  warmup_ratio: 0.03
  num_train_epochs: 3
  logging_steps: 10
  save_strategy: "epoch"
  evaluation_strategy: "epoch"
  fp16: false
  bf16: true
  optim: "adamw_torch"
  weight_decay: 0.01
  lr_scheduler_type: "cosine"
