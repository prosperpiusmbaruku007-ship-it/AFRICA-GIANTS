[cerebrium.deployment]
name = "chike-inference"
python_version = "3.11"
docker_base_image_url = "nvidia/cuda:12.1.1-runtime-ubuntu22.04"
min_replicas = 0
max_replicas = 2
cooldown = 60

[cerebrium.hardware]
compute = "ADA_L4"

[cerebrium.dependencies.pip]
vllm = "latest"
transformers = ">=4.43.0"
huggingface_hub = ">=0.23.0"
accelerate = ">=0.30.0"

[cerebrium.environment]
HF_TOKEN = ""
